name: required tests

# Default branch of this repository is master. A filter that names only
# main never matches a push, so Actions does not start the workflow.
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  mandatory:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ matrix.python-version }}
          auto-update-conda: true
          activate-environment: metamalevich
          environment-file: environment.yml
      - name: Mandatory pytest
        timeout-minutes: 30
        run: pytest -m mandatory --tb=short
