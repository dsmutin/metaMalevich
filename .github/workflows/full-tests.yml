name: full tests

# All pytest, then the light integrative examples.
# Community runners (examples/*/run_example.py) call `metametro benchbuild`.
# They download genomes and assemble, so they stay out of this workflow.
# The toy example does not need a bench build.
# A push of this file is included so Actions registers the workflow and the
# status badge has a run. Ordinary commits do not start it.

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - .github/workflows/full-tests.yml

concurrency:
  group: full-tests
  cancel-in-progress: false

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.12"
          auto-update-conda: true
          activate-environment: metamalevich
          environment-file: environment.yml
      - name: All tests
        timeout-minutes: 30
        run: pytest --tb=short
      - name: Light integrative examples
        timeout-minutes: 15
        run: |
          set -euo pipefail
          shopt -s nullglob
          ran=0
          for script in examples/*/run.py vignettes/*.py vignettes/*.sh; do
            if [[ "$script" == *.py ]]; then
              python "$script"
            else
              bash "$script"
            fi
            ran=1
          done
          if [[ "$ran" -eq 0 ]]; then
            echo "no light integrative example found" >&2
            exit 1
          fi
