name: full tests

# All pytest, light examples, then a solve on MetaMetro benches.
# In-process benches always materialise a ToCUMG. phage_10
# (phage_species_5_x10) is assembled only when samovar, MEGAHIT, and
# data/raw/genomes/T{1,3,4,5,7}.fna are already present. The GitHub runner
# does not have those inputs, so that bench records its contract.
# Community runners (examples/*/run_example.py) download genomes and stay out.
# A push of this file is included so Actions registers the workflow and the
# status badge has a run. Ordinary commits do not start it.

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - .github/workflows/full-tests.yml

concurrency:
  group: full-tests
  cancel-in-progress: false

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.12"
          auto-update-conda: true
          activate-environment: metamalevich
          environment-file: environment.yml
      - name: Install MetaMetro from the submodule
        run: |
          python -m pip install --no-deps --no-build-isolation -e external/MetaMetro
          metametro --version
          python -c "import metametro; print(metametro.__file__)"
      - name: All tests
        timeout-minutes: 30
        run: pytest --tb=short
      - name: Light integrative examples
        timeout-minutes: 15
        run: |
          set -euo pipefail
          shopt -s nullglob
          ran=0
          for script in examples/*/run.py vignettes/*.py vignettes/*.sh; do
            if [[ "$script" == *.py ]]; then
              python "$script"
            else
              bash "$script"
            fi
            ran=1
          done
          if [[ "$ran" -eq 0 ]]; then
            echo "no light integrative example found" >&2
            exit 1
          fi
      - name: Solve simple MetaMetro benches
        timeout-minutes: 30
        run: |
          python -m metamalevich solve \
            --bench bubble_strain_2 \
            --bench synthetic_reads_2 \
            --bench phage_10 \
            --colouring composition_kmeans \
            --colouring decaying
