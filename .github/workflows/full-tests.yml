name: full tests

# All pytest, light examples, then a solve on MetaMetro benches.
# The job installs MEGAHIT 1.2.9 (bioconda) into the env and SAMOVAR
# (ctlab/samovar at a pinned commit, its own conda env and install.sh), and
# fetches the pinned phage_10 genomes with `metametro benchfetch`. phage_10
# (phage_species_5_x10) is then assembled and solved with MetaMetro's pinned
# Kraken2 output and TAXDUMP; the job checks that its row is built and
# solved. In-process benches are skipped with a reason: they have toy
# sequences and no pinned Kraken2 output.
# Community runners (examples/*/run_example.py) download genomes and stay out.
# A push of this file is included so Actions registers the workflow and the
# status badge has a run. Ordinary commits do not start it.

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - .github/workflows/full-tests.yml

concurrency:
  group: full-tests
  cancel-in-progress: false

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.12"
          auto-update-conda: true
          activate-environment: metamalevich
          environment-file: environment.yml
      - name: Check the pinned MetaMetro install
        run: |
          metametro --version
          python -c "import metametro; print(metametro.__file__)"
      - name: All tests
        timeout-minutes: 30
        run: pytest --tb=short
      - name: Light integrative examples
        timeout-minutes: 15
        run: |
          set -euo pipefail
          shopt -s nullglob
          ran=0
          for script in examples/*/run.py vignettes/*.py vignettes/*.sh; do
            if [[ "$script" == *.py ]]; then
              python "$script"
            else
              bash "$script"
            fi
            ran=1
          done
          if [[ "$ran" -eq 0 ]]; then
            echo "no light integrative example found" >&2
            exit 1
          fi
      - name: Install MEGAHIT
        timeout-minutes: 15
        run: conda install -y -n metamalevich -c conda-forge -c bioconda megahit=1.2.9
      - name: Install SAMOVAR
        timeout-minutes: 40
        env:
          CI: "true"
          NCBI_EMAIL: test@samovar.com
          SAMOVAR_UPDATE_SHELL: "0"
          SAMOVAR_COMMIT: d6bb8246f9e31c7890f4393aa92bc7e0aa53d593
        run: |
          set -euo pipefail
          git clone https://github.com/ctlab/samovar "$RUNNER_TEMP/samovar"
          git -C "$RUNNER_TEMP/samovar" checkout "$SAMOVAR_COMMIT"
          conda env create -n samovar -f "$RUNNER_TEMP/samovar/environment.yml"
          conda activate samovar
          cd "$RUNNER_TEMP/samovar"
          chmod +x install.sh
          ./install.sh
          echo "$RUNNER_TEMP/samovar/bin" >> "$GITHUB_PATH"
      - name: Check assembly programs
        run: |
          which samovar megahit megahit_toolkit
          megahit --version
      - name: Fetch pinned phage genomes
        timeout-minutes: 10
        run: metametro benchfetch phage_10
      - name: Solve simple MetaMetro benches
        timeout-minutes: 30
        run: |
          set -euo pipefail
          solve_exit=0
          python -m metamalevich solve \
            --bench bubble_strain_2 \
            --bench synthetic_reads_2 \
            --bench phage_10 \
            --workdir "$RUNNER_TEMP/solve" \
            -o "$RUNNER_TEMP/solve.json" || solve_exit=$?
          # Print the phage_10 row and check it even when solve failed.
          python - "$RUNNER_TEMP/solve.json" "$solve_exit" <<'PY'
          import json, sys
          summary = json.load(open(sys.argv[1]))
          rows = {row["canonical_name"]: row for row in summary["benches"]}
          phage = rows["phage_species_5_x10"]
          print(json.dumps({k: v for k, v in phage.items() if k != "profile_fractions"}, indent=2))
          print("solve exit:", sys.argv[2], "status:", summary["status"])
          assert phage["build_status"] == "built", phage
          assert phage["solved"] is True, phage
          assert not phage.get("colourings_skipped"), phage.get("colourings_skipped")
          assert summary["ok"] is True, summary["status"]
          assert sys.argv[2] == "0", sys.argv[2]
          PY
      - name: Upload the solve summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solve-summary
          path: ${{ runner.temp }}/solve.json
          if-no-files-found: warn
