name: full tests

# All pytest, light examples, then a solve on MetaMetro benches.
# The pinned phage_10 genomes are fetched with `metametro benchfetch` first.
# In-process benches are skipped with a reason until MetaMetro pins their
# Kraken2 outputs. phage_10 (phage_species_5_x10) is assembled only when
# MetaMetro's checks pass (pinned genomes, samovar, MEGAHIT). The GitHub
# runner has no samovar or MEGAHIT, so that bench records its contract and
# the errors MetaMetro raised.
# Community runners (examples/*/run_example.py) download genomes and stay out.
# A push of this file is included so Actions registers the workflow and the
# status badge has a run. Ordinary commits do not start it.

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - .github/workflows/full-tests.yml

concurrency:
  group: full-tests
  cancel-in-progress: false

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.12"
          auto-update-conda: true
          activate-environment: metamalevich
          environment-file: environment.yml
      - name: Check the pinned MetaMetro install
        run: |
          metametro --version
          python -c "import metametro; print(metametro.__file__)"
      - name: All tests
        timeout-minutes: 30
        run: pytest --tb=short
      - name: Light integrative examples
        timeout-minutes: 15
        run: |
          set -euo pipefail
          shopt -s nullglob
          ran=0
          for script in examples/*/run.py vignettes/*.py vignettes/*.sh; do
            if [[ "$script" == *.py ]]; then
              python "$script"
            else
              bash "$script"
            fi
            ran=1
          done
          if [[ "$ran" -eq 0 ]]; then
            echo "no light integrative example found" >&2
            exit 1
          fi
      - name: Fetch pinned phage genomes
        timeout-minutes: 10
        run: metametro benchfetch phage_10
      - name: Solve simple MetaMetro benches
        timeout-minutes: 30
        run: |
          python -m metamalevich solve \
            --bench bubble_strain_2 \
            --bench synthetic_reads_2 \
            --bench phage_10
