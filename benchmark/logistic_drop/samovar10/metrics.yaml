input_graph: canonical 4-mer cosine kNN rebuilt from assembly contigs
graph_construction_method: symmetrized top-k cosine on canonical 4-mer frequencies
k: 4
assembler: contigs already present in the dataset bundle
tca_method: kraken2 k-mer counts rolled to species, aggregation=probability_sum
taxonomic_database: kraken2 report shipped with the dataset
taxonomy_database_version: samovar10/kraken2/whole_contig.report
classifier: kraken2
resolver: logistic_drop
resolver_parameters:
  graph: contig
  fit: pseudo-label neighbour agreement
  threshold: 0.5
profiling_method: length-weighted posterior; assigned_reads is 0 because no read-to-graph
  map is in the bundle
abundance_weight: node_length
coverage: unused; relative abundance is the share of contig bases
software_version: 0.4.1
graph_note: samovar10/graph/graph_meta.txt records top_k=8 and min_sim=0.15
tocumg:
  cfa: intermediate/samovar10/tocumg/cfa
